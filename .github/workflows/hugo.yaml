name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
    steps:
      - name: Check out site and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "$HOME/hugo"
          tar -xzf hugo.tar.gz -C "$HOME/hugo"
          rm hugo.tar.gz
          echo "$HOME/hugo" >> "$GITHUB_PATH"
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Build
        run: hugo build --gc --minify
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
