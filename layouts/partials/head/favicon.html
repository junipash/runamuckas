{{- if site.Params.favicon -}}
  {{- with site.Params.svgFavicon -}}
    <link rel="icon" type="image/svg+xml" href="{{- . -}}" />
    {{- with site.Params.svgFaviconFallback -}}
      <link rel="icon" type="image/png" href="{{- . -}}" />
    {{- end -}}
  {{- else -}}
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  {{- end -}}
{{- end -}}
{{- /* JetBrains Mono, sized down because it is wider than the theme's font */ -}}
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('{{- "fonts/jetbrains-mono-latin-wght-normal.woff2" | relURL -}}') format('woff2');
    font-weight: 100 800;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'JetBrains Mono';
    src: url('{{- "fonts/jetbrains-mono-latin-wght-italic.woff2" | relURL -}}') format('woff2');
    font-weight: 100 800;
    font-style: italic;
    font-display: swap;
  }

  html body {
    font-family: 'JetBrains Mono', monospace;
  }

  html body nav {
    font-size: 0.85em;
  }

  @media (max-width: 1023px) {
    html body .threshold {
      display: none;
    }
  }

  {{- /* put the title above the tabs on phones so both fit */ -}}
  @media (max-width: 767px) {
    html:root {
      --nav-height: 60px;
    }

    html body nav {
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    html body .links {
      font-size: min(3.4vw, 14px);
    }
  }
</style>
